[project]
name = "poc_grpc"
version = "0.1.0"
description = "A CLI client for gRPC server interactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pillow>=10.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poc_grpc*"]

[project.scripts]
poc_grpc = "poc_grpc.main:main"