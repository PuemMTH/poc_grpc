version: '3.8'

services:
  rabbitmq:
    image: "rabbitmq:3-management"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
  
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    
  sample-service:
    build:
      context: ./sample_service/
      dockerfile: Dockerfile
    expose:
      - "50052"
    environment:
      - SAMPLE_SERVICE_PORT=50052
    restart: unless-stopped
    volumes:
      - ./sample_service/processed_samples:/app/processed_samples

  api-producer:
    build:
      context: ../client/api-producer/
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLOUDAMQP_URL=amqp://guest:guest@rabbitmq:5672/%2f
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  api-consumer:
    build:
      context: ../client/api-consumer/
      dockerfile: Dockerfile
    environment:
      - CLOUDAMQP_URL=amqp://guest:guest@rabbitmq:5672/%2f
      - RABBITMQ_QUEUE=image_queue
      - SAMPLE_SERVICE_ADDRESS=sample-service:50052
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
      - sample-service
    restart: unless-stopped