version: '3.8'

services:
  api-service:
    build:
      context: ../client/api/
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - image-service
    environment:
      - PYTHONUNBUFFERED=1
      - GRPC_SERVER_ADDRESS=image-service:50051
    restart: unless-stopped

  image-service:
    build:
      context: ./image_service
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    volumes:
      - ./images:/app/images
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    scale: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; import image_service_pb2_grpc; import image_service_pb2; channel = grpc.insecure_channel('localhost:50051'); stub = image_service_pb2_grpc.ImageServiceStub(channel); stub.Health(image_service_pb2.HealthRequest())"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s