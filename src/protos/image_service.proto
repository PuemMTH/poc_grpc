syntax = "proto3";

package image_service;

service ImageService {
    rpc TestImage(TestImageRequest) returns (TestImageResponse);
    rpc Health(HealthRequest) returns (HealthResponse);
}

message TestImageRequest {
    bytes image_data = 1;
    string image_format = 2; // e.g., "jpeg", "png"
}

message TestImageResponse {
    string status = 1;
    string message = 2;
}

message HealthRequest {}

message HealthResponse {
    string status = 1;
    string message = 2;
}
